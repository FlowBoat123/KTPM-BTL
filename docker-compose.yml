services:
  backend:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_PATH: /app/data/dental-clinic.db
      SERVER_ADDRESS: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - sqlite-data:/app/data
    restart: unless-stopped
volumes:
  sqlite-data:
