server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}

spring:
  application:
    name: dental-clinic
  profiles:
    default: demo
  jackson:
    deserialization:
      fail-on-unknown-properties: true

app:
  jwt-secret: ${JWT_SECRET:}
  jwt-ttl-minutes: 120
  zone: Asia/Ho_Chi_Minh
  bootstrap:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}

---
# ==============================================================================
# Profile: postgres (Chuẩn Enterprise / Docker / Production / Load testing)
# ==============================================================================
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dental_clinic}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-postgres.sql
      separator: ";;"

---
# ==============================================================================
# Profile: demo (SQLite cho test local nhanh và bộ test tự động)
# ==============================================================================
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:sqlite:${DB_PATH:dental-clinic.db}?foreign_keys=on&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-test-query: SELECT 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      separator: ";;"
